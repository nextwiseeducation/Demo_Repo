databases:
  - name: nextwise-db
    plan: free
    databaseName: nextwise
    user: nextwise

services:
  - type: web
    name: nextwise-backend
    runtime: python
    plan: free
    rootDir: backend
    # createcachetable creates the table backing the database cache
    # (config/settings/base.py CACHES), which is where DRF stores its
    # rate-limit counters — without it, the first throttled request errors.
    # It is idempotent, so it is safe on every deploy.
    #
    # seed_client_needs installs the official NCSBN Client Needs categories.
    # The question importer looks these up strictly and refuses to invent
    # them, so that a typo in a content file cannot quietly fabricate an
    # "official" exam category — which means they have to be put there
    # deliberately, by this. Also idempotent.
    #
    # Migrations run here rather than in a preDeployCommand because Render's
    # free plan doesn't offer one. The trade-off to know about: the build
    # step runs before the new instance goes live, so a migration applies
    # even if the deploy that follows it fails. Worth moving to
    # preDeployCommand if this service is ever upgraded to a paid plan.
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput && python manage.py createcachetable && python manage.py seed_client_needs && python manage.py ensure_superuser"
    # --timeout 120 (up from gunicorn's 30s default): POST /api/admin/import/
    # (apps.admin_api) runs the NGN item-bank importer synchronously in-request
    # — there's no task queue on this project (see CACHES in
    # config/settings/base.py). A real multi-thousand-row workbook can take
    # well over 30s, and since the importer commits per row, a worker killed
    # mid-run leaves a partial import with no ImportLog row explaining it.
    startCommand: "gunicorn config.wsgi --timeout 120 --log-file -"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nextwise-db
          property: connectionString
      # Render assigns this web service the predictable hostname
      # nextwise-backend.onrender.com (unless that name is already taken by
      # an unrelated Render account, in which case Render auto-suffixes it
      # and this value must be updated to match).
      - key: ALLOWED_HOSTS
        value: nextwise-backend.onrender.com
      - key: RESEND_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Bootstraps the one initial /admin/ login (see
      # apps/accounts/management/commands/ensure_superuser.py) — Render's
      # free web-service plan has no Shell/SSH access, so `createsuperuser`
      # can't be run interactively after deploy.
      #
      # SECURITY: clear DJANGO_SUPERUSER_PASSWORD from the Render dashboard
      # once the first deploy has succeeded and the admin account exists.
      # The command no-ops from then on, so leaving it set gains nothing
      # while keeping a live admin password sitting in the service's
      # environment, readable by anyone with dashboard access. Set it again
      # temporarily only if the admin account ever needs re-bootstrapping.
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      # The canonical frontend URL — used both to build links in emails
      # (verification, password reset) and, via CORS_ALLOWED_ORIGINS'
      # default in config/settings/base.py, as the one origin the API
      # trusts. nextwise-frontend.onrender.com was trusted here too during
      # the DNS cutover to the custom domain; now that it's confirmed
      # working end-to-end and the Render subdomain is disabled on the
      # frontend service, that fallback has been dropped.
      - key: FRONTEND_URL
        value: https://nextwiseeducation.com
      - key: PYTHON_VERSION
        value: 3.13.12

  - type: web
    name: nextwise-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm ci && npm run build"
    staticPublishPath: ./dist
    envVars:
      # Baked into the build at compile time (see src/lib/api/client.ts) —
      # points the deployed frontend at the deployed backend's own
      # predictable hostname, so no Vite dev-proxy/CORS workaround is
      # needed in staging/prod.
      - key: VITE_API_BASE_URL
        value: https://nextwise-backend.onrender.com/api
    routes:
      # SPA fallback: react-router handles routing client-side, so a direct
      # load or refresh of e.g. /dashboard must still serve index.html
      # rather than 404 on a path that has no matching static file.
      - type: rewrite
        source: /*
        destination: /index.html
