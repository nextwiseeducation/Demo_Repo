databases:
  - name: nextwise-db
    plan: free
    databaseName: nextwise
    user: nextwise

services:
  - type: web
    name: nextwise-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput"
    startCommand: "gunicorn config.wsgi --log-file -"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nextwise-db
          property: connectionString
      # Render assigns this web service the predictable hostname
      # nextwise-backend.onrender.com (unless that name is already taken by
      # an unrelated Render account, in which case Render auto-suffixes it
      # and this value must be updated to match).
      - key: ALLOWED_HOSTS
        value: nextwise-backend.onrender.com
      - key: SENDGRID_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Points at the frontend static site below — used to build links in
      # emails (verification, password reset) and as the one origin
      # CORS_ALLOWED_ORIGINS permits (see config/settings/base.py).
      - key: FRONTEND_URL
        value: https://nextwise-frontend.onrender.com
      - key: PYTHON_VERSION
        value: 3.13.12

  - type: web
    name: nextwise-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: "npm ci && npm run build"
    staticPublishPath: ./dist
    envVars:
      # Baked into the build at compile time (see src/lib/api/client.ts) —
      # points the deployed frontend at the deployed backend's own
      # predictable hostname, so no Vite dev-proxy/CORS workaround is
      # needed in staging/prod.
      - key: VITE_API_BASE_URL
        value: https://nextwise-backend.onrender.com/api
    routes:
      # SPA fallback: react-router handles routing client-side, so a direct
      # load or refresh of e.g. /dashboard must still serve index.html
      # rather than 404 on a path that has no matching static file.
      - type: rewrite
        source: /*
        destination: /index.html
